<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TARS</title>
  <link rel="icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}">
  <link href="{{ url_for('static', filename='css/kiosk.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
</head>
<body>
  <!-- Screensaver overlay -->
  <div id="screensaver" class="screensaver hidden">
    <canvas id="screensaver-canvas"></canvas>
    <div id="screensaver-clock"></div>
  </div>

  <!-- Power menu overlay -->
  <div id="power-menu" class="power-menu hidden">
    <div class="power-menu-panel">
      <div class="power-menu-title">POWER</div>
      <div class="power-menu-divider"></div>
      <button class="power-btn" id="btn-reboot">REBOOT</button>
      <button class="power-btn power-btn-danger" id="btn-shutdown">SHUTDOWN</button>
      <button class="power-btn" id="btn-power-cancel">CANCEL</button>
    </div>
  </div>

  <!-- Overlay image -->
  <div id="overlay-image" class="overlay-image hidden">
    <img id="overlay-img" src="" alt="">
  </div>

  <!-- Main layout -->
  <div id="main">
    <!-- Top toolbar -->
    <div id="toolbar">
      <span class="toolbar-id">TERM-A1</span>
      <span id="toolbar-status" class="toolbar-label">[ACTIVE]</span>
      <span id="toolbar-info" class="toolbar-dim"></span>
      <button id="btn-power" class="toolbar-btn">PWR</button>
    </div>

    <!-- Chat area -->
    <div id="chat">
      <div id="messages"></div>
    </div>

    <!-- Mic level indicator -->
    <canvas id="mic-level" height="6"></canvas>

    <!-- Bottom status bar -->
    <div id="statusbar">
      <div id="status-badge">
        <div id="silence-fill"></div>
        <span id="status-text">BOOTING</span>
      </div>
      <div id="statusbar-right">
        <span id="dnd-indicator" class="hidden">DND</span>
        <span id="wifi-indicator"></span>
        <span id="cpu-temp"></span>
        <span id="battery"></span>
      </div>
    </div>
  </div>

  <script>
    const CHAR_NAME = "{{ char_name }}";
    const SCREENSAVER_LIST = {{ screensaver_list | tojson }};
    const SCREENSAVER_TIMEOUT_SEC = {{ screensaver_timeout }};
    const SCREENSAVER_CYCLE_SEC = {{ screensaver_cycle }};
    const SHOW_TIME = {{ show_time | tojson }};
    const LATITUDE = "{{ latitude }}";
    const LONGITUDE = "{{ longitude }}";
    const AMPM = {{ ampm | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/kiosk.js') }}"></script>
</body>
</html>
