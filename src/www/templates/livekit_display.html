<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TARS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#video-container {
    /* Rotate to portrait on landscape screen */
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
    overflow: hidden;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#controls {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    display: flex;
    gap: 8px;
    align-items: center;
}

#controls button {
    background: rgba(255,255,255,0.8);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: monospace;
}

#controls button:active { background: rgba(255,255,255,1); }

#close-btn { background: rgba(255,0,0,0.7) !important; color: #fff !important; }

#status {
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 9999;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px;
    border-radius: 4px;
    max-width: 90vw;
    word-wrap: break-word;
}
</style>
</head>
<body>

<div id="controls">
    <button id="audio-btn" onclick="toggleAudio()">Audio: ???</button>
    <button id="vol-down" onclick="changeVol(-0.2)">Vol-</button>
    <button id="vol-up" onclick="changeVol(0.2)">Vol+</button>
    <button id="close-btn" onclick="window.close()">X</button>
</div>
<div id="status">Connecting...</div>
<div id="video-container"></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const container = document.getElementById('video-container');
const status = document.getElementById('status');
const audioBtn = document.getElementById('audio-btn');

// Track all audio elements so we can control them
const audioElements = [];
let audioMuted = false;
let audioVolume = 1.0;

function updateAudioBtn() {
    const count = audioElements.length;
    if (count === 0) {
        audioBtn.textContent = 'Audio: no tracks';
    } else {
        audioBtn.textContent = audioMuted
            ? 'Audio: MUTED (' + count + ')'
            : 'Audio: ON vol=' + Math.round(audioVolume * 100) + '% (' + count + ')';
    }
}

function toggleAudio() {
    audioMuted = !audioMuted;
    audioElements.forEach(el => { el.muted = audioMuted; });
    updateAudioBtn();
}

function changeVol(delta) {
    audioVolume = Math.max(0, Math.min(1, audioVolume + delta));
    audioElements.forEach(el => { el.volume = audioVolume; });
    updateAudioBtn();
}

async function start() {
    status.textContent = 'Fetching token...';
    const resp = await fetch('/livekit-token');
    const { url, token } = await resp.json();

    status.textContent = 'Connecting to room...';

    const room = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: false,
        audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true },
        audioOutput: { deviceId: 'default' },
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === LivekitClient.Track.Kind.Video) {
            const el = track.attach();
            el.style.width = '100%';
            el.style.height = '100%';
            el.style.objectFit = 'cover';
            container.appendChild(el);
            status.textContent = 'Video: ' + participant.identity;
        } else if (track.kind === LivekitClient.Track.Kind.Audio) {
            const el = track.attach();
            el.volume = audioVolume;
            el.muted = audioMuted;
            el.autoplay = true;
            document.body.appendChild(el);
            audioElements.push(el);
            updateAudioBtn();
            status.textContent += ' | Audio: ' + participant.identity;

            // Force play — browsers may block autoplay
            el.play().catch(err => {
                status.textContent += ' [autoplay blocked - tap Audio btn]';
            });
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
        const detached = track.detach();
        detached.forEach(el => {
            const idx = audioElements.indexOf(el);
            if (idx !== -1) audioElements.splice(idx, 1);
            el.remove();
        });
        updateAudioBtn();
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
        status.textContent = 'Disconnected — reconnecting...';
        audioElements.length = 0;
        updateAudioBtn();
        setTimeout(start, 3000);
    });

    room.on(LivekitClient.RoomEvent.Connected, () => {
        status.textContent = 'Connected — waiting for tracks...';
    });

    await room.connect(url, token);
    updateAudioBtn();
}

(async function init() {
    while (true) {
        try {
            await start();
            break;
        } catch (e) {
            status.textContent = 'Error: ' + e.message + ' — retrying...';
            console.error('Connection failed, retrying in 3s...', e);
            await new Promise(r => setTimeout(r, 3000));
        }
    }
})();
</script>
</body>
</html>
