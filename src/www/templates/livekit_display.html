<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TARS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#video-container {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
    overflow: hidden;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 0%;
    transform: scale(1.4);
    transform-origin: center top;
}

#close-zone {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 9999;
    width: 60px;
    height: 60px;
}
</style>
</head>
<body>

<div id="close-zone" onclick="fetch('/close')"></div>
<div id="video-container"></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const container = document.getElementById('video-container');

let browserAudio = false;

async function start() {
    const resp = await fetch('/livekit-token');
    const data = await resp.json();
    const { url, token } = data;
    browserAudio = data.browser_audio || false;

    const room = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: false,
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === LivekitClient.Track.Kind.Video) {
            // Request low resolution from SFU to save Pi RAM/bandwidth
            publication.setVideoQuality(LivekitClient.VideoQuality.LOW);
            publication.setVideoDimensions({width: 320, height: 240});

            const el = track.attach();
            el.style.width = '100%';
            el.style.height = '100%';
            el.style.objectFit = 'cover';
            el.muted = true;
            container.appendChild(el);
        } else if (track.kind === LivekitClient.Track.Kind.Audio && browserAudio) {
            const el = track.attach();
            el.autoplay = true;
            el.volume = 1.0;
            document.body.appendChild(el);
            el.play().catch(() => {});
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach(el => el.remove());
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
        setTimeout(start, 3000);
    });

    await room.connect(url, token);
}

(async function init() {
    while (true) {
        try {
            await start();
            break;
        } catch (e) {
            console.error('Connection failed, retrying in 3s...', e);
            await new Promise(r => setTimeout(r, 3000));
        }
    }
})();
</script>
</body>
</html>
