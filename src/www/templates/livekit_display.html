<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TARS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#video-container {
    /* Rotate to portrait on landscape screen */
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vh;
    height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
    overflow: hidden;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#close-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 9999;
    background: rgba(255,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
}

#status {
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 9999;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 4px 8px;
    border-radius: 4px;
}
</style>
</head>
<body>

<button id="close-btn" onclick="window.close()">X</button>
<div id="status">Connecting...</div>
<div id="video-container"></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const container = document.getElementById('video-container');
const status = document.getElementById('status');

async function start() {
    status.textContent = 'Fetching token...';
    const resp = await fetch('/livekit-token');
    const { url, token } = await resp.json();

    status.textContent = 'Connecting to room...';

    const room = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: false,
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === LivekitClient.Track.Kind.Video) {
            const el = track.attach();
            el.style.width = '100%';
            el.style.height = '100%';
            el.style.objectFit = 'cover';
            container.appendChild(el);
            status.textContent = 'Video: ' + participant.identity;
        } else if (track.kind === LivekitClient.Track.Kind.Audio) {
            // Play agent audio through browser — stays in sync with video
            const el = track.attach();
            el.style.display = 'none';
            document.body.appendChild(el);
            status.textContent += ' | Audio: ' + participant.identity;
        }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
        track.detach().forEach(el => el.remove());
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
        status.textContent = 'Disconnected — reconnecting...';
        setTimeout(start, 3000);
    });

    room.on(LivekitClient.RoomEvent.Connected, () => {
        status.textContent = 'Connected — waiting for video...';
    });

    await room.connect(url, token);
}

(async function init() {
    while (true) {
        try {
            await start();
            break;
        } catch (e) {
            status.textContent = 'Error: ' + e.message + ' — retrying...';
            console.error('Connection failed, retrying in 3s...', e);
            await new Promise(r => setTimeout(r, 3000));
        }
    }
})();
</script>
</body>
</html>
